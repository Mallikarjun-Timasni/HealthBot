[project]
name = "healthbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.21.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.0",
]

[project.scripts]
healthbot = "healthbot:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
